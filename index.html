<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Tracker - Plan Treningowy z Tygodniami</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            accent: '#3b82f6'
                        },
                        darkbg: '#0b0f19',
                        cardbg: '#1e293b',
                        inputbg: '#0f172a'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Scrollbar & Utility Styles -->
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-10">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-[#0f172a]/95 backdrop-blur-md border-b border-slate-800 shadow-md">
        <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-dumbbell text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white leading-tight">GYM TRACKER</h1>
                    <p class="text-[11px] text-emerald-400 font-medium">Progresja Tygodniowa (RIR 3)</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="openHistoryModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 hover:text-blue-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1">
                    <i class="fa-solid fa-chart-line text-xs"></i>
                    <span>Historia</span>
                </button>
                <button onclick="resetCurrentDay()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                    <span>Reset</span>
                </button>
            </div>
        </div>

        <!-- WEEK SELECTOR BAR -->
        <div class="max-w-md mx-auto px-3 py-2 border-t border-slate-800/80 flex items-center justify-between bg-slate-900/60">
            <div class="relative flex-1 mr-3">
                <select id="week-selector" onchange="switchWeek(this.value)" class="w-full bg-slate-800 text-white border border-slate-700 rounded-lg pl-3 pr-8 py-1.5 text-sm font-bold focus:outline-none focus:border-blue-500 appearance-none cursor-pointer">
                    <!-- Dynamicznie generowane opcje tygodni -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
            <button onclick="addNewWeek()" class="px-2.5 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/40 text-xs font-bold rounded-lg transition whitespace-nowrap flex items-center space-x-1">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>Tydzień</span>
            </button>
        </div>

        <!-- DAY TABS -->
        <div class="max-w-md mx-auto px-2 pb-2 pt-1 overflow-x-auto no-scrollbar flex space-x-1 text-xs">
            <button id="tab-day1" onclick="switchDay('day1')" class="flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center border border-transparent">
                <span>DZIEŃ 1</span>
                <span class="text-[10px] opacity-75 font-normal">Plecy/Biceps</span>
            </button>
            <button id="tab-day2" onclick="switchDay('day2')" class="flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center border border-transparent">
                <span>DZIEŃ 2</span>
                <span class="text-[10px] opacity-75 font-normal">Barki/Triceps</span>
            </button>
            <button id="tab-day3" onclick="switchDay('day3')" class="flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center border border-transparent">
                <span>DZIEŃ 3</span>
                <span class="text-[10px] opacity-75 font-normal">Klata/Przedr.</span>
            </button>
            <button id="tab-day4" onclick="switchDay('day4')" class="flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center border border-transparent">
                <span>DZIEŃ 4</span>
                <span class="text-[10px] opacity-75 font-normal">Nogi</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-md mx-auto w-full px-3 pt-4 flex-1">
        
        <!-- DAY BANNER & STATS -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 mb-4 backdrop-blur-sm shadow-lg">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <div class="flex items-center space-x-2 mb-1">
                        <span id="week-badge" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-blue-500/20 text-blue-400 border border-blue-500/30 uppercase">
                            TYDZIEŃ 1
                        </span>
                        <span id="day-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 uppercase">
                            DZIEŃ 1
                        </span>
                    </div>
                    <h2 id="day-title" class="text-lg font-bold text-white">Plecy + Biceps + Nogi</h2>
                </div>
                <div class="text-right">
                    <span class="text-[11px] text-slate-400 block uppercase tracking-wider font-medium">Tonaż całkowity</span>
                    <span id="total-volume" class="text-xl font-extrabold text-emerald-400">0 <span class="text-xs font-normal text-slate-300">kg</span></span>
                </div>
            </div>

            <!-- PROGRESS BAR -->
            <div class="mt-3">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>Postęp treningu</span>
                    <span id="progress-percentage" class="font-bold text-slate-200">0%</span>
                </div>
                <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-blue-500 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- EXERCISES LIST CONTAINER -->
        <div id="exercises-container" class="space-y-4">
            <!-- Dynamic JavaScript content injects here -->
        </div>

    </main>

    <!-- HISTORY / COMPARISON MODAL -->
    <div id="history-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-chart-line text-blue-400 text-lg"></i>
                    <h3 class="font-bold text-white text-base">Historia & Progresja</h3>
                </div>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="mb-3">
                <label class="text-xs text-slate-400 block mb-1 font-medium">Wybierz ćwiczenie do porównania:</label>
                <select id="history-exercise-select" onchange="renderExerciseHistory()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-medium focus:outline-none focus:border-emerald-500">
                    <!-- Dynamic choices -->
                </select>
            </div>

            <div id="history-content" class="flex-1 overflow-y-auto space-y-3 pr-1 pt-1">
                <!-- Dynamic history view -->
            </div>
        </div>
    </div>

    <script>
        const workoutData = {
            day1: {
                badge: "DZIEŃ 1",
                title: "Plecy + Biceps + Nogi",
                exercises: [
                    { id: "d1_ex1", name: "1. Przysiady na suwnicy / ze sztangą", sets: 3, targetReps: "8–10", tempo: "2121", rir: "3", tag: "NOGI" },
                    { id: "d1_ex2", name: "2. Ściąganie drążka nachwytem", sets: 4, targetReps: "10–12", tempo: "2121", rir: "3", tag: "PLECY" },
                    { id: "d1_ex3", name: "3. Wiosłowanie wyciąg dolny podchwytem", sets: 3, targetReps: "12", tempo: "2121", rir: "3", tag: "PLECY" },
                    { id: "d1_ex4", name: "4. Ściąganie uchwytu wyciągu jednorącz", sets: 3, targetReps: "10–15", tempo: "2121", rir: "3", tag: "PLECY" },
                    { id: "d1_ex5", name: "5. Ugięcia na modlitewniku (sztanga łamana)", sets: 3, targetReps: "12", tempo: "1221", rir: "3", tag: "BICEPS" },
                    { id: "d1_ex6", name: "6. Ugięcia młotkowe z hantlami", sets: 2, targetReps: "15", tempo: "—", rir: "3", tag: "BICEPS" },
                    { id: "d1_ex7", name: "7. Przyciąganie nóg do brzucha w zwisie", sets: 3, targetReps: "20", tempo: "—", rir: "3", tag: "BRZUCH" }
                ]
            },
            day2: {
                badge: "DZIEŃ 2",
                title: "Barki + Triceps + Nogi",
                exercises: [
                    { id: "d2_ex1", name: "1. Uginanie nóg leżąc/siedząc na maszynie", sets: 3, targetReps: "10–12", tempo: "2011", rir: "3", tag: "NOGI" },
                    { id: "d2_ex2", name: "2. OHP (Wyciskanie żołnierskie)", sets: 3, targetReps: "8–15", tempo: "2131", rir: "3", tag: "BARKI" },
                    { id: "d2_ex3", name: "3. Wznosy hantli do boku siedząc", sets: 3, targetReps: "20", tempo: "2121", rir: "3", tag: "BARKI" },
                    { id: "d2_ex4", name: "4. Y-raise z hantlami (skos 30°)", sets: 2, targetReps: "12", tempo: "1121", rir: "3", tag: "BARKI" },
                    { id: "d2_ex5", name: "5. Prostowanie linki wyciągu jednorącz", sets: 3, targetReps: "10", tempo: "—", rir: "3", tag: "TRICEPS" },
                    { id: "d2_ex6", name: "6. Francuz leżąc oburącz sztangą łamaną", sets: 3, targetReps: "10–15", tempo: "1121", rir: "3", tag: "TRICEPS" },
                    { id: "d2_ex7", name: "7. Allahy na wyciągu górnym", sets: 3, targetReps: "12–15", tempo: "—", rir: "3", tag: "BRZUCH" }
                ]
            },
            day3: {
                badge: "DZIEŃ 3",
                title: "Klata + Przedramię + Nogi",
                exercises: [
                    { id: "d3_ex1", name: "1. Prostowanie nóg na maszynie", sets: 3, targetReps: "12–15", tempo: "2011", rir: "3", tag: "NOGI" },
                    { id: "d3_ex2", name: "2. Wyciskanie na ławce płaskiej", sets: 3, targetReps: "5–8", tempo: "—", rir: "3", tag: "KLATA" },
                    { id: "d3_ex3", name: "3. Wyciskanie hantli na skosie 45°", sets: 2, targetReps: "12", tempo: "3121", rir: "3", tag: "KLATA" },
                    { id: "d3_ex4", name: "4. Rozpiętki na bramie z góry", sets: 3, targetReps: "10–15", tempo: "1131", rir: "3", tag: "KLATA" },
                    { id: "d3_ex5", name: "5. Ugięcia nadgarstków na wyciągu dolnym", sets: 3, targetReps: "12", tempo: "—", rir: "3", tag: "PRZEDRAMIĘ" }
                ]
            },
            day4: {
                badge: "DZIEŃ 4",
                title: "Dedykowany Dzień Nóg",
                exercises: [
                    { id: "d4_ex1", name: "1. Przysiady ze sztangą / Suwnica", sets: 4, targetReps: "6–10", tempo: "2121", rir: "3", tag: "NOGI" },
                    { id: "d4_ex2", name: "2. Rumuński Martwy Ciąg (RDL)", sets: 3, targetReps: "8–10", tempo: "3121", rir: "3", tag: "NOGI" },
                    { id: "d4_ex3", name: "3. Suwnica / Przysiady bułgarskie", sets: 3, targetReps: "10–12", tempo: "2011", rir: "3", tag: "NOGI" },
                    { id: "d4_ex4", name: "4. Uginanie nóg na maszynie (dwugłowe)", sets: 3, targetReps: "12–15", tempo: "2011", rir: "3", tag: "NOGI" },
                    { id: "d4_ex5", name: "5. Wspięcia na palce stojąc / siedząc", sets: 4, targetReps: "15–20", tempo: "2121", rir: "3", tag: "ŁYDKI" }
                ]
            }
        };

        let currentDayKey = 'day1';
        let currentWeekNumber = 1;
        let totalWeeks = 4;
        let savedData = {};

        function loadSavedData() {
            try {
                const data = localStorage.getItem('gym_tracker_weeks_data');
                if (data) {
                    const parsed = JSON.parse(data);
                    savedData = parsed.data || {};
                    totalWeeks = parsed.totalWeeks || 4;
                    currentWeekNumber = parsed.currentWeekNumber || 1;
                } else {
                    // Fallback to old storage structure if exists
                    const oldData = localStorage.getItem('gym_tracker_data');
                    if (oldData) {
                        const parsedOld = JSON.parse(oldData);
                        savedData['week_1'] = parsedOld;
                    }
                }
            } catch (e) {
                console.error("Błąd odczytu z localStorage:", e);
                savedData = {};
            }
        }

        function saveData() {
            try {
                const payload = {
                    totalWeeks: totalWeeks,
                    currentWeekNumber: currentWeekNumber,
                    data: savedData
                };
                localStorage.setItem('gym_tracker_weeks_data', JSON.stringify(payload));
            } catch (e) {
                console.error("Błąd zapisu do localStorage:", e);
            }
        }

        function renderWeekTabs() {
            const select = document.getElementById('week-selector');
            select.innerHTML = '';

            for (let i = 1; i <= totalWeeks; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `Tydzień ${i}`;
                if (i === currentWeekNumber) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            }
        }

        function switchWeek(weekNum) {
            currentWeekNumber = parseInt(weekNum);
            saveData();
            renderWeekTabs();
            renderDayContent();
        }

        function addNewWeek() {
            totalWeeks++;
            currentWeekNumber = totalWeeks;
            saveData();
            renderWeekTabs();
            renderDayContent();
        }

        function switchDay(dayKey) {
            currentDayKey = dayKey;
            
            ['day1', 'day2', 'day3', 'day4'].forEach(key => {
                const btn = document.getElementById(`tab-${key}`);
                if (key === dayKey) {
                    btn.className = "flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center bg-gradient-to-r from-emerald-500 to-emerald-600 text-white shadow-md shadow-emerald-500/20 border border-emerald-400/30";
                } else {
                    btn.className = "flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center bg-slate-800/80 text-slate-400 hover:bg-slate-700/80 hover:text-slate-200 border border-slate-700/50";
                }
            });

            renderDayContent();
        }

        function getPreviousWeekSetData(exId, setNum) {
            if (currentWeekNumber <= 1) return null;
            const prevWeekKey = `week_${currentWeekNumber - 1}`;
            if (!savedData[prevWeekKey]) return null;

            const wKey = `${exId}_s${setNum}_w`;
            const rKey = `${exId}_s${setNum}_r`;
            const w = savedData[prevWeekKey][wKey];
            const r = savedData[prevWeekKey][rKey];

            if (w !== undefined && r !== undefined && w !== "" && r !== "") {
                return { weight: w, reps: r };
            }
            return null;
        }

        function renderDayContent() {
            const currentWorkout = workoutData[currentDayKey];
            const weekDataKey = `week_${currentWeekNumber}`;
            const currentWeekData = savedData[weekDataKey] || {};

            document.getElementById('week-badge').innerText = `TYDZIEŃ ${currentWeekNumber}`;
            document.getElementById('day-badge').innerText = currentWorkout.badge;
            document.getElementById('day-title').innerText = currentWorkout.title;

            const container = document.getElementById('exercises-container');
            container.innerHTML = '';

            currentWorkout.exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/90 border border-slate-700/70 rounded-2xl p-4 shadow-md backdrop-blur-sm";

                let rowsHtml = '';
                for (let i = 1; i <= ex.sets; i++) {
                    const setKeyWeight = `${ex.id}_s${i}_w`;
                    const setKeyReps = `${ex.id}_s${i}_r`;
                    const setKeyDone = `${ex.id}_s${i}_d`;

                    const valWeight = currentWeekData[setKeyWeight] !== undefined ? currentWeekData[setKeyWeight] : '';
                    const valReps = currentWeekData[setKeyReps] !== undefined ? currentWeekData[setKeyReps] : '';
                    const isDone = currentWeekData[setKeyDone] === true;

                    // Pobranie danych z poprzedniego tygodnia
                    const prevData = getPreviousWeekSetData(ex.id, i);
                    const prevHintHtml = prevData 
                        ? `<div class="text-[10px] text-blue-400/90 font-medium pl-8 pb-1 flex items-center space-x-1">
                             <i class="fa-solid fa-clock-rotate-left text-[9px]"></i>
                             <span>Poprzednio (Tydz. ${currentWeekNumber - 1}): <strong class="text-blue-300">${prevData.weight} kg × ${prevData.reps}</strong></span>
                           </div>`
                        : '';

                    rowsHtml += `
                        <div class="py-1 border-b border-slate-700/40 last:border-0">
                            <div class="flex items-center space-x-2 py-1 ${isDone ? 'opacity-60' : ''}">
                                <span class="w-6 text-xs font-bold text-slate-400 text-center">#${i}</span>
                                
                                <div class="flex-1 flex items-center bg-slate-900/80 border border-slate-700/80 rounded-xl px-2.5 py-1 focus-within:border-emerald-500 transition">
                                    <input type="number" step="0.5" placeholder="0" value="${valWeight}" 
                                        oninput="updateInputValue('${setKeyWeight}', this.value)"
                                        class="w-full bg-transparent text-sm font-semibold text-white focus:outline-none text-right pr-1">
                                    <span class="text-[11px] text-slate-400 font-medium">kg</span>
                                </div>

                                <div class="flex-1 flex items-center bg-slate-900/80 border border-slate-700/80 rounded-xl px-2.5 py-1 focus-within:border-emerald-500 transition">
                                    <input type="number" placeholder="${ex.targetReps.split('–')[0]}" value="${valReps}" 
                                        oninput="updateInputValue('${setKeyReps}', this.value)"
                                        class="w-full bg-transparent text-sm font-semibold text-white focus:outline-none text-right pr-1">
                                    <span class="text-[11px] text-slate-400 font-medium">powt.</span>
                                </div>

                                <button onclick="toggleSetDone('${setKeyDone}')" class="w-9 h-9 rounded-xl flex items-center justify-center transition ${isDone ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/20' : 'bg-slate-700/60 text-slate-400 hover:bg-slate-700'}">
                                    <i class="fa-solid ${isDone ? 'fa-check' : 'fa-check'} text-sm"></i>
                                </button>
                            </div>
                            ${prevHintHtml}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30 uppercase tracking-wider">${ex.tag}</span>
                            <h3 class="text-sm font-bold text-white mt-1">${ex.name}</h3>
                        </div>
                        <div class="text-right text-[11px] text-slate-400 space-y-0.5">
                            <div>Reps: <span class="font-bold text-slate-200">${ex.targetReps}</span></div>
                            <div>Tempo: <span class="font-bold text-slate-200">${ex.tempo}</span> | RIR: <span class="font-bold text-slate-200">${ex.rir}</span></div>
                        </div>
                    </div>
                    <div class="mt-2 space-y-1">
                        ${rowsHtml}
                    </div>
                `;

                container.appendChild(card);
            });

            calculateStats();
        }

        function updateInputValue(key, value) {
            const weekKey = `week_${currentWeekNumber}`;
            if (!savedData[weekKey]) savedData[weekKey] = {};

            if (value === "") {
                delete savedData[weekKey][key];
            } else {
                savedData[weekKey][key] = parseFloat(value) || value;
            }
            saveData();
            calculateStats();
        }

        function toggleSetDone(key) {
            const weekKey = `week_${currentWeekNumber}`;
            if (!savedData[weekKey]) savedData[weekKey] = {};

            savedData[weekKey][key] = !savedData[weekKey][key];
            saveData();
            renderDayContent();
        }

        function calculateStats() {
            const currentWorkout = workoutData[currentDayKey];
            const weekKey = `week_${currentWeekNumber}`;
            const currentWeekData = savedData[weekKey] || {};

            let totalVolume = 0;
            let totalSets = 0;
            let completedSets = 0;

            currentWorkout.exercises.forEach(ex => {
                for (let i = 1; i <= ex.sets; i++) {
                    totalSets++;
                    const setKeyWeight = `${ex.id}_s${i}_w`;
                    const setKeyReps = `${ex.id}_s${i}_r`;
                    const setKeyDone = `${ex.id}_s${i}_d`;

                    const w = parseFloat(currentWeekData[setKeyWeight]) || 0;
                    const r = parseFloat(currentWeekData[setKeyReps]) || 0;

                    if (currentWeekData[setKeyDone]) {
                        completedSets++;
                    }

                    totalVolume += (w * r);
                }
            });

            document.getElementById('total-volume').innerHTML = `${totalVolume.toLocaleString('pl-PL')} <span class="text-xs font-normal text-slate-300">kg</span>`;
            
            const percentage = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0;
            document.getElementById('progress-percentage').innerText = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function resetCurrentDay() {
            if (confirm(`Czy na pewno chcesz zresetować dane dla Dnia ${workoutData[currentDayKey].badge} w Tygodniu ${currentWeekNumber}?`)) {
                const weekKey = `week_${currentWeekNumber}`;
                if (savedData[weekKey]) {
                    const currentWorkout = workoutData[currentDayKey];
                    currentWorkout.exercises.forEach(ex => {
                        for (let i = 1; i <= ex.sets; i++) {
                            delete savedData[weekKey][`${ex.id}_s${i}_w`];
                            delete savedData[weekKey][`${ex.id}_s${i}_r`];
                            delete savedData[weekKey][`${ex.id}_s${i}_d`];
                        }
                    });
                    saveData();
                    renderDayContent();
                }
            }
        }

        function openHistoryModal() {
            const select = document.getElementById('history-exercise-select');
            select.innerHTML = '';

            Object.keys(workoutData).forEach(dKey => {
                const dayObj = workoutData[dKey];
                const group = document.createElement('optgroup');
                group.label = `${dayObj.badge}: ${dayObj.title}`;

                dayObj.exercises.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.id;
                    opt.innerText = ex.name;
                    group.appendChild(opt);
                });

                select.appendChild(group);
            });

            document.getElementById('history-modal').classList.remove('hidden');
            renderExerciseHistory();
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function renderExerciseHistory() {
            const exId = document.getElementById('history-exercise-select').value;
            const container = document.getElementById('history-content');
            container.innerHTML = '';

            let foundExercise = null;
            Object.values(workoutData).forEach(day => {
                const match = day.exercises.find(e => e.id === exId);
                if (match) foundExercise = match;
            });

            if (!foundExercise) return;

            for (let w = 1; w <= totalWeeks; w++) {
                const weekKey = `week_${w}`;
                const weekData = savedData[weekKey] || {};

                let setsHtml = '';
                let weekVolume = 0;
                let hasData = false;

                for (let i = 1; i <= foundExercise.sets; i++) {
                    const weight = weekData[`${exId}_s${i}_w`];
                    const reps = weekData[`${exId}_s${i}_r`];
                    const done = weekData[`${exId}_s${i}_d`];

                    if (weight !== undefined && reps !== undefined) {
                        hasData = true;
                        const vol = (parseFloat(weight) || 0) * (parseFloat(reps) || 0);
                        weekVolume += vol;

                        setsHtml += `
                            <div class="flex justify-between items-center text-xs py-1 border-b border-slate-700/50 last:border-0">
                                <span class="text-slate-400 font-medium">Seria #${i}</span>
                                <span class="font-bold text-slate-100">${weight} kg × ${reps} powt. ${done ? '<i class="fa-solid fa-check text-emerald-400 ml-1"></i>' : ''}</span>
                            </div>
                        `;
                    }
                }

                const item = document.createElement('div');
                item.className = "bg-slate-900 border border-slate-700/80 rounded-xl p-3";

                if (hasData) {
                    item.innerHTML = `
                        <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-800">
                            <span class="text-xs font-bold text-blue-400">TYDZIEŃ ${w}</span>
                            <span class="text-xs font-semibold text-emerald-400">Tonaż: ${weekVolume} kg</span>
                        </div>
                        <div class="space-y-0.5">
                            ${setsHtml}
                        </div>
                    `;
                } else {
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400">TYDZIEŃ ${w}</span>
                            <span class="text-xs text-slate-300 italic">Brak wpisanych danych</span>
                        </div>
                    `;
                }

                container.appendChild(item);
            }
        }

        window.onload = function() {
            loadSavedData();
            renderWeekTabs();
            switchDay('day1');
        };
    </script>
</body>
</html>
